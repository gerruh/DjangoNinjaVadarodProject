  version: '3.8'

  x-common-env: &common-env
    DEBUG: ${DEBUG:-True}
    SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production}
    DATABASE_URL: postgresql://dnp_user:dnp_pass@db:5432/dnp_db
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    PYTHONPATH: /app

  services:
    db:
      image: postgres:16-alpine
      container_name: dnp_db
      environment:
        POSTGRES_DB: dnp_db
        POSTGRES_USER: dnp_user
        POSTGRES_PASSWORD: dnp_pass
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U dnp_user -d dnp_db"]
        interval: 10s
        timeout: 5s
        retries: 5

    redis:
      image: redis:7-alpine
      container_name: dnp_redis
      command: redis-server --appendonly yes
      volumes:
        - redis_data:/data
      ports:
        - "6379:6379"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

    web:
      build: .
      container_name: dnp_web
      command: >
        sh -c "echo 'Waiting for database...' &&
               until pg_isready -h db -p 5432; do 
                 sleep 2; 
               done &&
               echo 'Database ready!' &&
               python manage.py migrate --noinput &&
               python manage.py runserver 0.0.0.0:8000"
      volumes:
        - .:/app
        - poetry_cache:/root/.cache/pypoetry
      ports:
        - "8000:8000"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment: *common-env

    celery:
      build: .
      container_name: dnp_celery
      command: >
        sh -c "echo 'Waiting for services...' &&
               until pg_isready -h db -p 5432; do sleep 2; done &&
               celery -A dnp worker --loglevel=info --concurrency=4"
      volumes:
        - .:/app
        - poetry_cache:/root/.cache/pypoetry
      depends_on:
        - db
        - redis
      environment: *common-env

    celery-beat:
      build: .
      container_name: dnp_celery_beat
      command: >
        sh -c "echo 'Waiting for services...' &&
               until pg_isready -h db -p 5432; do sleep 2; done &&
               celery -A dnp beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
      volumes:
        - .:/app
        - poetry_cache:/root/.cache/pypoetry
      depends_on:
        - db
        - redis
      environment: *common-env

  volumes:
    postgres_data:
    redis_data:
    poetry_cache:

  networks:
    default:
      name: dnp_network